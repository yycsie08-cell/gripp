; 手機搖桿 — ESP32 端韌體
; 手機 APP 用 WiFi(UDP)把按鍵送過來,板子再用藍牙假裝成一支手把。
;
; 選板子:VS Code 左下角 PlatformIO 的環境名稱,或
;     pio run -e c3_supermini -t upload
; 也可以直接開 pc_tool 的控制面板,用點的。
;
; 每個環境上面那行「; 說明:」會顯示在控制面板的板子清單裡。
; 想加別的板子:複製一段 [env:xxx],改 board 和腳位就好(見 README)。

[platformio]
default_envs = c3_supermini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    https://github.com/lemmingDev/ESP32-BLE-Gamepad.git
    h2zero/NimBLE-Arduino @ ^2.3.0
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=0

; 說明:ESP32-C3 Super Mini(又小又便宜,預設)
[env:c3_supermini]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGH_LED_PIN=8
    -DGH_LED_ACTIVE=LOW
    -DGH_BOOT_PIN=9

; 說明:ESP32 32S / NodeMCU-32S(便宜的經典款)
[env:esp32_32s]
board = nodemcu-32s
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DGH_LED_PIN=2
    -DGH_LED_ACTIVE=HIGH
    -DGH_BOOT_PIN=0

; 說明:ESP32-S3 Super Mini
[env:s3_supermini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
; S3 預設 240MHz 會很燙,這個專案 160MHz 就夠
board_build.f_cpu = 160000000L
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGH_LED_PIN=-1
    -DGH_BOOT_PIN=0

; 說明:其他一般 ESP32 開發板(DevKit 類)
[env:esp32dev]
board = esp32dev
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DGH_LED_PIN=2
    -DGH_LED_ACTIVE=HIGH
    -DGH_BOOT_PIN=0
